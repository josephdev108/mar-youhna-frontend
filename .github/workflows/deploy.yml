name: Deploy frontend to production

on:
  push:
    branches:
      - main

concurrency:
  group: production-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy on server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (build on server)
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 120s
          command_timeout: 20m
          envs: GITHUB_TOKEN
          script_stop: true
          script: |
            set -e

            REPO_DIR=/home/u918418209/domains/stmaryabram.com/mar-youhna-frontend-src
            DEPLOY_DIR=/home/u918418209/domains/stmaryabram.com/public_html/marjohn
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/josephdev108/mar-youhna-frontend.git"

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            if ! command -v npm >/dev/null 2>&1; then
              echo "ERROR: npm not found on server. Install Node.js (nvm) via SSH, then re-run deploy."
              exit 1
            fi

            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone --depth 1 -b main "$REPO_URL" "$REPO_DIR"
            else
              cd "$REPO_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin main --depth 1
              git reset --hard origin/main
            fi

            cd "$REPO_DIR"
            npm ci
            npm run build

            rm -rf "$DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"
            cp -a dist/. "$DEPLOY_DIR/"

            echo "Deployed $(git rev-parse --short HEAD) to $DEPLOY_DIR"
