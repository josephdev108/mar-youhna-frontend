name: Deploy frontend to production

on:
  push:
    branches:
      - main

concurrency:
  group: production-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload dist to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_DIR: /home/u918418209/domains/stmaryabram.com/public_html/marjohn
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS=(-p "$SSH_PORT" -o ConnectTimeout=120 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          TARGET="${SSH_USER}@${SSH_HOST}"

          ssh "${SSH_OPTS[@]}" "$TARGET" "rm -rf '${DEPLOY_DIR}' && mkdir -p '${DEPLOY_DIR}'"

          tar -czf - -C dist . | ssh "${SSH_OPTS[@]}" "$TARGET" "tar -xzf - -C '${DEPLOY_DIR}'"

          ssh "${SSH_OPTS[@]}" "$TARGET" "ls -la '${DEPLOY_DIR}' | head -20"
          echo "Deployed to ${DEPLOY_DIR}"
